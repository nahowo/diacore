openapi: 3.0.3
info:
  title: DiaCore Integration API
  version: 1.0.0
  description: 1형 당뇨 환자를 위한 데이터 기반 통합 관리 및 예측 플랫폼 DiaCore API 명세서

paths:
  # ==========================================
  # Log
  # ==========================================
  /api/v1/logs/glucose:
    post:
      tags:
        - LogCommand
      summary: add glucose log
      operationId: createGlucoseLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlucoseLogRequest'
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
    get:
      tags:
        - LogQuery
      summary: get glucose logs
      operationId: getGlucoseLogs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseLogPageResponse'

  /api/v1/logs/meals:
    post:
      tags:
        - LogCommand
      summary: add meal log
      operationId: createMealLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealLogRequest'
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
    get:
      tags:
        - LogQuery
      summary: get meal logs
      operationId: getMealLogs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLogPageResponse'

  /api/v1/logs/insulin:
    post:
      tags:
        - LogCommand
      summary: add insulin log
      operationId: createInsulinLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsulinLogRequest'
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
    get:
      tags:
        - LogQuery
      summary: get insulin logs
      operationId: getInsulinLogs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsulinLogPageResponse'

  # ==========================================
  # Profile
  # ==========================================
  /api/v1/profiles/carb-ratios:
    get:
      tags:
        - ProfileQuery
      summary: get carb ratios (시간대별 탄수비 조회)
      operationId: getCarbRatios
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbRatioListResponse'
    put:
      tags:
        - ProfileCommand
      summary: update carb ratios (시간대별 탄수비 일괄 수정)
      operationId: updateCarbRatios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarbRatioListRequest'
      responses:
        '204':
          description: successfully updated

  /api/v1/profiles/carb-ratios/histories:
    get:
      tags:
        - ProfileQuery
      summary: get carb ratio update history
      operationId: getCarbRatioHistory
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbRatioHistoryPageResponse'

  /api/v1/profiles/insulin-sensitivities:
    get:
      tags:
        - ProfileQuery
      summary: get insulin sensitivities
      operationId: getInsulinSensitivities
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsulinSensitivityListResponse'
    put:
      tags:
        - ProfileCommand
      summary: update insulin sensitivities
      operationId: updateInsulinSensitivities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsulinSensitivityListRequest'
      responses:
        '204':
          description: successfully updated

  /api/v1/profiles/insulin-sensitivities/histories:
    get:
      tags:
        - ProfileQuery
      summary: get insulin sensitivity update history
      operationId: getInsulinSensitivityHistory
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsulinSensitivityHistoryPageResponse'

  /api/v1/profiles/basal:
    get:
      tags:
        - ProfileQuery
      summary: get basal insulin dose
      operationId: getBasalDose
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasalProfileResponse'

    put:
      tags:
        - ProfileCommand
      summary: update basal insulin dose
      operationId: updateBasalDose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBasalProfileRequest'
      responses:
        '204':
          description: successfully updated

  /api/v1/profiles/insulin-characteristics:
    get:
      tags:
        - ProfileQuery
      summary: get insulin characteristics
      operationId: getInsulinCharacteristics
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsulinCharacteristicsResponse'

    put:
      tags:
        - ProfileCommand
      summary: update insulin characteristics
      operationId: updateInsulinCharacteristics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInsulinCharacteristicsRequest'
      responses:
        '204':
          description: successfully updated

  /api/v1/profiles/parameters:
    get:
      tags:
        - ProfileQuery
      summary: get active therapy parameters by hour
      operationId: getTherapyParametersByHour
      parameters:
        - name: hour
          in: query
          required: true
          description: "조회할 기준 시간 (0~23)"
          schema:
            type: integer
            minimum: 0
            maximum: 23
            example: 15
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyParameterResponse'

  /api/v1/profiles/recommendations:
    get:
      tags:
        - ProfileQuery
      summary: get therapy parameters recommendation history
      operationId: getRecommendationHistory
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationResponse'

  # ==========================================
  # Simulation
  # ==========================================
  /api/v1/simulations/predict:
    post:
      tags:
        - SimulationQuery
      summary: predict glucose
      operationId: predictGlucose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlucoseSimulationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseSimulationResponse'

  # ==========================================
  # User
  # ==========================================
  /api/v1/users/register:
    post:
      summary: Register User
      operationId: registerUser
      tags:
        - User Command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'

  /api/v1/users/login:
    post:
      summary: Login
      operationId: loginUser
      tags:
        - User Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /api/v1/users/withdraw:
    delete:
      summary: Withdraw User
      operationId: withdrawUser
      tags:
        - User Command
      responses:
        '204':
          description: success

  # ==========================================
  # NightScout
  # ==========================================
  /api/v1/entries:
    post:
      tags:
        - EntriesCommand
      summary: Nightscout 호환 CGM 데이터 수신
      operationId: ingestNightscoutEntries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NightscoutEntry'
      responses:
        '200':
          description: success

components:
  schemas:
    CommonResponse:
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          description: API 요청 성공 여부
          example: true
        code:
          type: string
          description: 비즈니스 응답 코드
          example: "SUCCESS"
        message:
          type: string
          description: 응답 메시지
          example: "요청이 성공적으로 처리되었습니다."
        data:
          type: object
          description: 응답 데이터
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: 응답 발생 시각

    CreatedResponse:
      type: object
      required: [ id, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          description: 생성된 리소스의 ID
        createdAt:
          type: string
          format: date-time
          description: 생성된 시각

    GlucoseLogRequest:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: integer
          description: "glucose (mg/dL)"
        trendArrow:
          type: string
          example: "FLAT"
        source:
          type: string
          example: "dexcom G7"

    MealLogRequest:
      type: object
      required: [timestamp, carbohydrateG, mealType]
      properties:
        timestamp:
          type: string
          format: date-time
        carbohydrateG:
          type: float
          description: "carb (g)"
        mealType:
          type: string
          example: "BREAKFAST"
        foodDesc:
          type: string
          example: "사과 1개"

    InsulinLogRequest:
      type: object
      required: [timestamp, dose, insulinType]
      properties:
        timestamp:
          type: string
          format: date-time
        dose:
          type: number
          format: float
          description: "insulin (Unit)"
        insulinType:
          type: string
          example: "RAPID_ACTING"

    TherapyParametersResponse:
      type: object
      properties:
        carbRatio:
          type: number
          format: float
          description: "carb ratio (g/U)"
        insulinSensitivity:
          type: number
          format: float
          description: "insulin sensitivity (mg/dL/U)"

    TherapyParametersRequest:
      type: object
      required: [carbRatio, insulinSensitivity]
      properties:
        carbRatio:
          type: number
          format: float
        insulinSensitivity:
          type: number
          format: float

    RecommendationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parameterType:
          type: string
          example: "CARB_RATIO"
        originalValue:
          type: number
          format: float
        recommendedValue:
          type: number
          format: float
        reasonText:
          type: string
          example: "최근 7일간 아침 식후 고혈당 지속"

    GlucoseSimulationRequest:
      type: object
      required: [ currentGlucose, iob, cob ]
      properties:
        currentGlucose:
          type: integer
          description: "현재 혈당 수치 (mg/dL)"
          example: 125
        iob:
          type: number
          format: float
          description: "활성 인슐린 (Insulin On Board, U)"
          example: 1.2
        cob:
          type: number
          format: float
          description: "활성 탄수화물 (Carbs On Board, g)"
          example: 20.0
        bgMomentum:
          type: integer
          description: "최근 혈당 변화율 (mg/dL / 5min) - 옵션"
          example: -5
        plannedCarbs:
          type: float
          description: "섭취 예정인 탄수화물 양 (g)"
          example: 15
        plannedInsulin:
          type: number
          format: float
          description: "주입 예정인 인슐린 볼러스 (U)"
          example: 0.0
        plannedExercise:
          $ref: '#/components/schemas/ExerciseSimulationEvent'

    ExerciseSimulationEvent:
      type: object
      required: [ intensity, durationMinutes ]
      properties:
        intensity:
          $ref: '#/components/schemas/ExerciseIntensity'
        durationMinutes:
          type: integer
          description: "예상 지속 시간 (분)"
          example: 45

    ExerciseIntensity:
      type: string
      enum: [ LOW, MEDIUM, HIGH ]
      description: "운동 강도"

    GlucoseSimulationResponse:
      type: object
      required: [ reason, eventualBg, trajectories ]
      properties:
        reason:
          type: string
          description: "OpenAPS Reason"
          example: "BG 125, IOB 1.2. Planned exercise HIGH reduces ISF. 15g carbs needed to stay above 90."
        eventualBg:
          type: integer
          description: "IOB와 COB가 모두 소모된 후 도달할 최종 예상 혈당"
          example: 110
        snoozeBg:
          type: integer
          description: "단기적 과잉 교정을 막기 위한 참고 혈당"
          example: 95
        recommendedAction:
          $ref: '#/components/schemas/RecommendedAction'
        trajectories:
          type: array
          description: "시간(5분 단위)에 따른 다중 예측 곡선 포인트 리스트"
          items:
            $ref: '#/components/schemas/PredictionTrajectoryPoint'

    RecommendedAction:
      type: object
      required: [ actionType ]
      properties:
        actionType:
          $ref: '#/components/schemas/ActionType'
        suggestedValue:
          type: number
          format: float
          description: "액션에 따른 수치 (기초율 u/hr, 볼러스 U, 또는 탄수화물 g)"
          example: 15.0
        message:
          type: string
          example: "고강도 운동 전 저혈당 예방을 위해 15g의 탄수화물 섭취를 권장합니다."

    ActionType:
      type: string
      enum: [ MAINTAIN, TEMP_BASAL, SMB, SUSPEND, CARB_SUGGESTION ]
      description: "권장되는 조치 유형"

    PredictionTrajectoryPoint:
      type: object
      required: [ offsetMinutes ]
      properties:
        offsetMinutes:
          type: integer
          description: "현재 시점으로부터의 경과 시간 (보통 5분 단위)"
          example: 15
        iobPred:
          type: integer
          description: "IOB 기반 예측 수치 (인슐린만 작용할 때)"
        cobPred:
          type: integer
          description: "COB 기반 예측 수치 (남은 탄수화물 흡수 시)"
        zeroTempPred:
          type: integer
          description: "인슐린 주입 완전 중단(Zero-temp) 시 예상 수치"
        uamPred:
          type: integer
          description: "미식별 활동(UAM) 감지 시 예측 수치"
        simulatedPred:
          type: integer
          description: "사용자가 입력한 식사/인슐린/운동 시나리오를 반영한 최종 시뮬레이션 예측 수치"

    RegisterUserRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "securePassword123!"
        name:
          type: string
          example: "사용자"

    LoginUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "securePassword123!"

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Access Token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    GlucoseLogResponse:
      type: object
      required: [ id, timestamp, value ]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        value: { type: integer }
        trendArrow: { type: string }
        source: { type: string }

    MealLogResponse:
      type: object
      required: [ id, timestamp, carbohydrateG, mealType ]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        carbohydrateG: { type: float }
        mealType: { type: string }
        foodDesc: { type: string }

    InsulinLogResponse:
      type: object
      required: [ id, timestamp, dose, insulinType ]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        dose: { type: number, format: float }
        insulinType: { type: string }

    GlucoseLogPageResponse:
      type: object
      required: [ content, totalElements ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/GlucoseLogResponse'
        totalElements: { type: integer, format: int64 }
        pageNumber: { type: integer }

    MealLogPageResponse:
      type: object
      required: [ content, totalElements ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MealLogResponse'
        totalElements: { type: integer, format: int64 }
        pageNumber: { type: integer }

    InsulinLogPageResponse:
      type: object
      required: [ content, totalElements ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InsulinLogResponse'
        totalElements: { type: integer, format: int64 }
        pageNumber: { type: integer }

    CarbRatioSegment:
      type: object
      required: [ startTime, value ]
      properties:
        startTime:
          type: integer
          description: "시작 시간 (0~23)"
          example: 8
        value:
          type: number
          format: float
          description: "탄수비 (g/U)"
          example: 12.5

    CarbRatioListRequest:
      type: object
      required: [ segments, changeSource ]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CarbRatioSegment'
        changeSource:
          $ref: '#/components/schemas/ChangeSource'
        reasonText:
          type: string
          description: "변경 상세 사유 (선택 사항)"

    CarbRatioListResponse:
      type: object
      required: [ segments, updatedAt ]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CarbRatioSegment'
        updatedAt:
          type: string
          format: date-time

    InsulinSensitivitySegment:
      type: object
      required: [ startTime, value ]
      properties:
        startTime:
          type: integer
          description: "시작 시간 (0~23)"
          example: 0
        value:
          type: number
          format: float
          description: "인슐린 민감도 (mg/dL/U)"
          example: 50.0

    InsulinSensitivityListRequest:
      type: object
      required: [ segments, changeSource ]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/InsulinSensitivitySegment'
        changeSource:
          $ref: '#/components/schemas/ChangeSource'
        reasonText:
          type: string
          description: "변경 상세 사유 (선택 사항)"

    InsulinSensitivityListResponse:
      type: object
      required: [ segments, updatedAt ]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/InsulinSensitivitySegment'
        updatedAt:
          type: string
          format: date-time

    TherapyParameterResponse:
      type: object
      required: [ hour, carbRatio, insulinSensitivity ]
      properties:
        hour:
          type: integer
          description: "요청한 기준 시간"
          example: 15
        carbRatio:
          type: number
          format: float
          description: "해당 시간에 적용되는 탄수비 (g/U)"
          example: 12.5
        insulinSensitivity:
          type: number
          format: float
          description: "해당 시간에 적용되는 인슐린 민감도 (mg/dL/U)"
          example: 45.0

    ChangeSource:
      type: string
      enum:
        - MANUAL
        - AI_RECOMMENDED
      description: "변경 출처 (MANUAL: 수동 입력, AI_RECOMMENDED: AI 추천값 적용)"

    CarbRatioHistoryPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSnapshotHistoryResponse'
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer

    InsulinSensitivityHistoryPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSnapshotHistoryResponse'
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer

    ProfileSnapshotHistoryResponse:
      type: object
      required: [ snapshotSegments, changeSource, createdAt ]
      properties:
        snapshotSegments:
          type: array
          description: "변경되기 직전의 전체 24시간 세그먼트 데이터 (스냅샷)"
          items:
            $ref: '#/components/schemas/TherapySegment'
        changeSource:
          $ref: '#/components/schemas/ChangeSource'
        reasonText:
          type: string
          description: "변경 상세 사유 (선택)"
          example: "점심 식후 혈당이 튀어서 전체적으로 비율 상향"
        createdAt:
          type: string
          format: date-time
          description: "해당 스냅샷이 기록된 일시"

    TherapySegment:
      type: object
      required: [ startTime, value ]
      properties:
        startTime:
          type: integer
          description: "적용 시작 시간 (0~23)"
          example: 7
        value:
          type: number
          format: float
          description: "설정 값 (CR의 경우 g/U, ISF의 경우 mg/dL/U)"
          example: 12.0

    NightscoutEntry:
      type: object
      description: "Nightscout 업로더(xDrip, Nightscout4iOS 등)가 전송하는 데이터 포맷"
      properties:
        type:
          type: string
          example: "sgv"
        sgv:
          type: integer
          description: "혈당 수치"
          example: 125
        direction:
          type: string
          description: "추세 화살표"
          example: "Flat"
        device:
          type: string
          example: "Nightscout4iOS"
        dateString:
          type: string
          format: date-time
          example: "2026-07-29T11:53:20.000Z"
        date:
          type: integer
          format: int64
          description: "Unix timestamp (ms)"
          example: 1690592000000

    BasalProfileResponse:
      type: object
      required:
        - dailyBasalUnits
        - basalInsulinName
      properties:
        dailyBasalUnits:
          type: number
          format: float
          description: "하루 총 기저 인슐린 용량 (U)"
          example: 10.0
        basalInsulinName:
          $ref: '#/components/schemas/BasalInsulinName'
        updatedAt:
          type: string
          format: date-time

    UpdateBasalProfileRequest:
      type: object
      required:
        - dailyBasalUnits
        - insulinName
      properties:
        dailyBasalUnits:
          type: number
          format: float
          description: "하루 총 기저 인슐린 용량 (U)"
          example: 7.0
        basalInsulinName:
          $ref: '#/components/schemas/BasalInsulinName'

    InsulinCharacteristicsResponse:
      type: object
      required:
        - diaHours
        - peakMinutes
      properties:
        diaHours:
          type: number
          format: float
          description: "인슐린 지속 시간 (Duration of Insulin Action, 시간 단위)"
          example: 4.0
        peakMinutes:
          type: integer
          description: "인슐린 최대 작용 시점 (Peak, 분 단위 - 예: 속효성 보통 60~90분)"
          example: 75
        updatedAt:
          type: string
          format: date-time

    UpdateInsulinCharacteristicsRequest:
      type: object
      required:
        - diaHours
        - peakMinutes
      properties:
        diaHours:
          type: number
          format: float
          description: "인슐린 지속 시간 (시간 단위, 보통 3~6시간)"
          example: 4.0
        peakMinutes:
          type: integer
          description: "인슐린 최대 작용 시점 (분 단위)"
          example: 75

    BasalInsulinName:
      type: string
      enum:
        - TRESIBA
        - LANTUS
        - TOUJEO
        - LEVEMIR
        - OTHER
